<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ogBg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="60%" stop-color="#0b111e" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Emerald-Cyan Glow Gradients -->
    <linearGradient id="ogBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <linearGradient id="ogCardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <radialGradient id="ogSpotlight" cx="300" cy="200" r="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.22)" />
      <stop offset="60%" stop-color="rgba(6, 182, 212, 0.08)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
    </radialGradient>

    <filter id="ogGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)" />
  <rect width="1200" height="630" fill="url(#ogSpotlight)" />

  <!-- Subtle Tech Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Glowing Emblem Section (Left) -->
  <g transform="translate(100, 110)">
    <!-- Glow halo -->
    <circle cx="90" cy="90" r="80" fill="rgba(16, 185, 129, 0.25)" filter="url(#ogGlow)" />
    
    <!-- Emblem Squircle -->
    <rect x="10" y="10" width="160" height="160" rx="36" fill="#0d1424" stroke="url(#ogBrandGrad)" stroke-width="4" />
    
    <!-- Database Base -->
    <ellipse cx="90" cy="120" rx="42" ry="14" fill="#047857" opacity="0.85" />
    <path d="M48 120 v10 c0 8 18.8 14 42 14 s42 -6 42 -14 v-10 Z" fill="#065f46" />
    <ellipse cx="90" cy="130" rx="42" ry="14" fill="none" stroke="#34d399" stroke-width="2" opacity="0.7" />

    <ellipse cx="90" cy="100" rx="42" ry="14" fill="#059669" opacity="0.9" />
    <path d="M48 100 v10 c0 8 18.8 14 42 14 s42 -6 42 -14 v-10 Z" fill="#047857" />
    <ellipse cx="90" cy="110" rx="42" ry="14" fill="none" stroke="#6ee7b7" stroke-width="2" opacity="0.8" />

    <!-- Optical Lens Ring -->
    <circle cx="90" cy="74" r="36" fill="none" stroke="url(#ogBrandGrad)" stroke-width="6" />
    <circle cx="90" cy="74" r="26" fill="rgba(6, 182, 212, 0.2)" stroke="#38bdf8" stroke-width="2" />

    <!-- Center Refractive Prism -->
    <polygon points="90,50 108,74 90,98 72,74" fill="url(#ogBrandGrad)" />
    <polygon points="90,50 108,74 90,74" fill="#a7f3d0" opacity="0.9" />
    <polygon points="90,74 108,74 90,98" fill="#38bdf8" opacity="0.8" />
    <polygon points="72,74 90,74 90,98" fill="#059669" opacity="0.9" />
    <polygon points="72,74 90,50 90,74" fill="#6ee7b7" opacity="0.7" />
    <circle cx="90" cy="74" r="5" fill="#ffffff" />
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(310, 150)">
    <text x="0" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="82" font-weight="800" fill="#ffffff" letter-spacing="-2">Mongo<tspan fill="url(#ogBrandGrad)" font-weight="900">Lens</tspan></text>
    <rect x="495" y="12" width="130" height="38" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" />
    <text x="515" y="38" font-family="'Fira Code', monospace" font-size="18" font-weight="800" fill="#34d399" letter-spacing="2">STUDIO</text>
  </g>

  <!-- Main Headline / Value Proposition -->
  <text x="100" y="350" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="700" fill="#f1f5f9" letter-spacing="-0.5">
    The Next-Generation Web MongoDB GUI &amp; Query Studio
  </text>
  
  <text x="100" y="395" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    High-performance visual database explorer with in-line editing, AI assistant &amp; aggregation builder.
  </text>

  <!-- 4 Feature Badges (Bottom Row) -->
  <g transform="translate(100, 460)">
    <!-- Badge 1: AI Query Assistant -->
    <g transform="translate(0, 0)">
      <rect width="230" height="70" rx="14" fill="url(#ogCardBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#a7f3d0">✨ AI QUERY COPILOT</text>
      <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Natural Language to Query</text>
    </g>

    <!-- Badge 2: Aggregation Pipeline -->
    <g transform="translate(250, 0)">
      <rect width="230" height="70" rx="14" fill="url(#ogCardBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#c084fc">⚡ AGGREGATION PIPELINE</text>
      <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Interactive Stage Inspector</text>
    </g>

    <!-- Badge 3: In-Line Editing -->
    <g transform="translate(500, 0)">
      <rect width="230" height="70" rx="14" fill="url(#ogCardBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#38bdf8">📝 IN-LINE CELL EDITING</text>
      <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Spreadsheet-Style Grid</text>
    </g>

    <!-- Badge 4: Web Compass Alternative -->
    <g transform="translate(750, 0)">
      <rect width="240" height="70" rx="14" fill="url(#ogCardBg)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.5" />
      <text x="20" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#fbbf24">🌐 ZERO-INSTALL WEB GUI</text>
      <text x="20" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="400" fill="#cbd5e1">Modern Compass Alternative</text>
    </g>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(930, 60)">
    <rect width="170" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1" />
    <circle cx="20" cy="18" r="5" fill="#10b981" />
    <text x="35" y="23" font-family="'Fira Code', monospace" font-size="12" font-weight="600" fill="#34d399">v2.0 PRO READY</text>
  </g>
</svg>
