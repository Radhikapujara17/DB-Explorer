<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="lensGrad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="diskGrad" x1="16" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle / Shield -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#lensGrad)" stroke-width="2" />
  
  <!-- Subtle Internal Grid Glow -->
  <circle cx="32" cy="32" r="22" stroke="rgba(16,185,129,0.15)" stroke-width="1" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="26" stroke="rgba(6,182,212,0.1)" stroke-width="1" />

  <!-- Database Cylinders / Data Layers (The "Mongo" Foundation) -->
  <!-- Bottom Plate -->
  <ellipse cx="32" cy="44" rx="16" ry="5.5" fill="#047857" opacity="0.8" />
  <path d="M16 44 v4 c0 3 7.2 5.5 16 5.5 s16 -2.5 16 -5.5 v-4 Z" fill="#065f46" />
  <ellipse cx="32" cy="48" rx="16" ry="5.5" fill="none" stroke="#34d399" stroke-width="0.8" opacity="0.6" />

  <!-- Middle Plate -->
  <ellipse cx="32" cy="36" rx="16" ry="5.5" fill="#059669" opacity="0.9" />
  <path d="M16 36 v4 c0 3 7.2 5.5 16 5.5 s16 -2.5 16 -5.5 v-4 Z" fill="#047857" />
  <ellipse cx="32" cy="40" rx="16" ry="5.5" fill="none" stroke="#6ee7b7" stroke-width="0.8" opacity="0.7" />

  <!-- The Optical Lens Aperture Ring (The "Lens" Clarity) -->
  <circle cx="32" cy="27" r="14" fill="none" stroke="url(#lensGrad)" stroke-width="2.5" filter="url(#neonGlow)" />
  <circle cx="32" cy="27" r="10" fill="rgba(6,182,212,0.15)" stroke="#38bdf8" stroke-width="1.2" />

  <!-- Central Refractive Diamond Prism Core -->
  <polygon points="32,18 39,27 32,36 25,27" fill="url(#lensGrad)" />
  <polygon points="32,18 39,27 32,27" fill="#a7f3d0" opacity="0.8" />
  <polygon points="32,27 39,27 32,36" fill="#38bdf8" opacity="0.7" />
  <polygon points="25,27 32,27 32,36" fill="#059669" opacity="0.9" />
  <polygon points="25,27 32,18 32,27" fill="#6ee7b7" opacity="0.6" />

  <!-- Center Sparkle / Specular Highlight -->
  <circle cx="32" cy="27" r="1.8" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
