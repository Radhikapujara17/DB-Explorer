version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: db_explorer_mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ecommerce_db
    volumes:
      - mongo_data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: db_explorer_server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DEFAULT_MONGO_URI=mongodb://mongodb:27017
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: db_explorer_client
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo_data:
